<!-- index.html — My lil acid bassline: a 303-style synth with filter and amp ADSR, gate length, delay, 32-step sequencer,
     per-knob automation and MIDI export. One page, no build, no dependencies. Pure half: acidbass.js. (Saved patterns keep the storage key "acidbass2" from before the rename, so nobody loses theirs.)
     Author: Ari Klopfer / A_Development · MIT -->
<style>
  :root{--ink:#16161a;--silver1:#e2e3e6;--silver2:#b5b8be;--red:#d8321f;--amber:#ffb23c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#2a2b30;font:11px/1.3 "Arial Narrow",Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
  .case{max-width:780px;margin:0 auto;padding:10px 12px 12px;background:linear-gradient(180deg,var(--silver1),var(--silver2));
    border-bottom:6px solid #7a7d84;display:flex;flex-direction:column;gap:10px}
  .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:3px}
  .head b{font-size:15px;letter-spacing:.18em}.head span{font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  .sect{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end}
  .panel{background:#17171b;border-radius:5px;padding:8px 8px 6px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;color:#eee}
  .lab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:#eee}
  .kw{display:flex;flex-direction:column;align-items:center;gap:2px;width:62px}
  .knob{width:44px;height:44px;border-radius:50%;cursor:ns-resize;touch-action:none;position:relative;outline:none;
    background:radial-gradient(circle at 35% 30%,#555,#111 70%);box-shadow:0 2px 4px #000a,inset 0 0 0 2px #000}
  .knob::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:15px;margin-left:-1.5px;background:#fff;border-radius:2px;
    transform-origin:50% 19px;transform:rotate(var(--a,0deg))}
  .knob:focus-visible{box-shadow:0 0 0 3px var(--amber)}
  .au{display:none;flex-direction:column;gap:2px;align-items:center}#case.showauto .au{display:flex}
  .au>div{display:flex;gap:2px}
  .au input{width:36px;padding:1px;font:10px Consolas,monospace;border:1px solid #555;border-radius:2px;background:#eee;color:#111;-webkit-user-select:text;user-select:text}
  .au .rt{width:36px}.au .on{padding:0 5px;font-size:11px}
  .knob.auto{box-shadow:0 0 0 2px var(--amber),0 2px 4px #000a}
  .panel.hidden,select.hidden{display:none}
  #midiIn{font-size:10px;max-width:150px}
  .eg{display:flex;flex-direction:column;gap:3px;min-width:0}.eg .gt{font-size:9px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
  .krow{display:flex;gap:4px;flex-wrap:wrap}
  canvas.envc{width:100%;height:36px;background:#0d0d11;border:1px solid #333;border-radius:3px;display:block}
  #dMs{width:64px;padding:2px;font:11px Consolas,monospace;border:1px solid #555;border-radius:2px;background:#eee;color:#111;-webkit-user-select:text;user-select:text}
  .val{font:10px Consolas,monospace;color:#bcd;height:12px}
  button{font:inherit;cursor:pointer}

  .btn:focus-visible,.sb:focus-visible,.chip:focus-visible,.key:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  .btn.on{background:linear-gradient(#ffd27a,#ff9d1c);box-shadow:inset 0 0 0 1px #8a4b00}

  .cell{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:1}

  .sb.note{background:linear-gradient(#ffe7a8,#ffb23c)}

  textarea{width:100%;height:46px;font:10px Consolas,monospace;border:1px solid #555;border-radius:3px;background:#f4f4f6;resize:vertical;-webkit-user-select:text;user-select:text}

</style></head><body>
<div class="case" id="case">
  <div class="head"><b>MY LIL ACID BASS</b><span>by A_Development</span></div>

  <div class="panel" id="knobs"></div>
  <div class="panel hidden" id="fx">
    <div class="eg"><div class="gt">Delay</div><div class="krow" id="fxK"></div></div>
    <div class="eg"><div class="gt">Mode</div>
      <div class="krow" style="align-items:center;gap:8px"><button class="btn" id="dPP" aria-pressed="true" title="repeats alternate left and right">Ping-pong</button><button class="btn" id="dFat" aria-pressed="false" title="darker, saturated, slowly wobbling repeats">Fat</button><button class="btn" id="dSync" aria-pressed="false" title="Time snaps to note divisions of the tempo (1/16, 1/8., 1/4T ...)">Sync</button></div>
      <label class="grp" style="margin-top:6px"><span class="t" style="color:#eee" title="the delay time in ms; follows the tempo when Sync is on">time ms</span><input type="number" id="dMs" min="20" max="1000" step="1" aria-label="Delay time in milliseconds"></label>
    </div>
  </div>
  <div class="panel hidden" id="env">
    <div class="eg"><div class="gt">Filter envelope</div><div class="krow" id="envF"></div><canvas class="envc" id="cvF" aria-label="Filter envelope shape"></canvas></div>
    <div class="eg"><div class="gt">Amp envelope</div><div class="krow" id="envA"></div><canvas class="envc" id="cvA" aria-label="Amp envelope shape"></canvas></div>
    <div class="eg"><div class="gt">Gate</div><div class="krow" id="envG"></div></div>
  </div>

  <div class="sect">
    <div class="grp"><span class="t">wave</span><button class="btn" id="wSaw" aria-pressed="true">Saw</button><button class="btn" id="wSq" aria-pressed="false">Square</button></div>
    <div class="grp"><span class="t">swing</span><input type="range" id="swing" min="0" max="100" value="0" aria-label="Swing"></div>
    <button class="btn" id="envBtn" aria-pressed="false" title="show the filter and amp ADSR and the gate length">Envelope</button>
    <button class="btn" id="midiBtn" aria-pressed="false" title="play and record from a MIDI keyboard or from FL Studio through a virtual MIDI cable (Chrome / Edge)">MIDI in</button>
    <select id="midiIn" class="hidden" aria-label="MIDI input"></select><span id="midiMsg" role="status" style="font-size:10px;color:#333"></span>
    <button class="btn" id="fxBtn" aria-pressed="false" title="show the delay: time, feedback, mix, ping-pong, fat">Delay</button>
    <button class="btn" id="autoBtn" aria-pressed="false" title="show per-knob automation: min %, max %, ~ on/off, beats per sweep">Automate</button>
    <label class="grp"><input type="checkbox" id="sync"><span class="t" style="margin:0 0 0 3px">stop at pattern end</span></label>
  </div>

  <div class="sect">
    <div class="keys" id="keys" role="group" aria-label="Keyboard"></div>
    <div class="grp"><button class="btn" id="oUp">Up</button><button class="btn" id="oDn">Down</button><button class="btn" id="mAcc">Accent</button><button class="btn" id="mSl">Slide</button></div>
  </div>

  <div class="steps" id="steps" role="group" aria-label="Steps"></div>
  <div style="font-size:10px;color:#333">Add a note: click a step (blue outline), press a key. Remove one: click the step, press <b>Rest</b>. Under each step: octave · <b>A</b>ccent · <b>S</b>lide. Keep <b>Write</b> on.</div>

  <div class="sect">
    <div class="grp"><span class="t">pattern</span><span id="pname" style="font:bold 12px Consolas,monospace;min-width:34px">I-A1</span></div>
    <div class="grp" id="gBank"><span class="t">bank</span></div>
    <div class="grp" id="gGroup"><span class="t">group</span></div>
    <div class="grp" id="gSlot"><span class="t">no.</span></div>
  </div>

  <div class="sect">
    <button class="btn run" id="run" aria-pressed="false">Run / Stop</button>
    <button class="btn" id="mode" aria-pressed="false" title="Pattern: loop this pattern. Track: play the song chain">Pattern</button>
    <button class="btn" id="wmode" title="Pitch: tap keys to write at the step. Time: a step button cycles note / rest / tie">Pitch write</button>
    <button class="btn" id="rec" aria-pressed="false" title="While on, a key writes its note into the selected step and moves on">Write</button><button class="btn" id="wRest" title="make the selected step a rest (removes the note) and move on">Rest</button><button class="btn" id="wTie" title="make the selected step a tie (holds the note before it) and move on">Tie</button>
    <button class="btn" id="back">Back</button><button class="btn" id="next">Next</button>
    <button class="btn" id="lenM" aria-label="Shorter pattern">−</button><span id="len" style="font:bold 11px Consolas,monospace;min-width:48px;text-align:center">LEN 16</span><button class="btn" id="lenP" aria-label="Longer pattern">+</button>
    <button class="btn" id="clear">Clear</button>
  </div>

  <div class="sect">
    <span class="t" style="font-size:9px;letter-spacing:.08em;text-transform:uppercase">song</span><span id="song" style="font:11px Consolas,monospace;flex:1;min-width:120px">(empty)</span>
    <button class="btn" id="sAdd">+ Add</button><button class="btn" id="sClr">Clear song</button><button class="btn" id="demo" title="overwrite I-A1..I-A6, the song and the sound with a starter set">Load demo set</button>
  </div>

  <div>
    <textarea id="io" spellcheck="false" aria-label="Pattern JSON" placeholder="Export fills this with the pattern; paste JSON here and press Import"></textarea>
    <div class="row"><button class="btn" id="expFiles" title="download every pattern as .txt and .mid, plus the song, in one zip">Export folder (txt + MIDI)</button><button class="btn" id="exp">Show pattern JSON</button><button class="btn" id="imp">Import into pattern</button><span id="msg" role="status"></span></div>
  </div>
</div>
<script src="acidbass.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const T = window.TB303;
let S = T.newState();
let ctx = null, osc, f1, f2, vca, master;
const mods = { oct: 0, accent: false, slide: false };   // sticky: shape live play and Write
let cursor = 0, timeMode = false, rec = true, songMode = 'pattern';
const run = { on: false, step: 0, slot: 0, songPos: 0, next: 0, stopAtEnd: false };
const queue = [];
let sweep = 0, lastFreq = 110, timer = null;

// ---- audio ----
function ensureAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  buildGraph(new (window.AudioContext || window.webkitAudioContext)());
}
function buildGraph(c) {
  ctx = c;
  osc = ctx.createOscillator(); osc.type = S.wave === 'square' ? 'square' : 'sawtooth'; osc.frequency.value = 110;
  // Two cascaded lowpass biquads: 24 dB/oct, resonance only on the second so the peak is a single clean ridge.
  f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = 0.5; f1.frequency.value = T.cutoffHz(S.knobs.cutoff);
  f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = T.resQ(S.knobs.res); f2.frequency.value = f1.frequency.value;
  vca = ctx.createGain(); vca.gain.value = 0;
  master = ctx.createGain(); master.gain.value = S.knobs.volume;
  // ponytail: tanh soft clip stands in for the 303's output stage; it also tames the resonance peak.
  const sh = ctx.createWaveShaper(), c2 = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) c2[i] = Math.tanh((i / 511.5 - 1) * 1.6);
  sh.curve = c2;
  osc.connect(f1); f1.connect(f2); f2.connect(vca); vca.connect(master); master.connect(sh);
  buildDelay(sh);
  osc.start();
}
// ---- delay: dry + a wet bus fed by either a ping-pong pair or a single (mono) line ----
// Ping-pong: the input enters the left line, which feeds the right, which feeds the left again, so repeats alternate
// sides every `time`. Mono: one line feeding itself, centred. Fat mode darkens (lowpass), saturates (tanh) and slowly
// wobbles the time (a 0.7 Hz LFO, ~2 ms deep) on every repeat, and lifts the wet level a little, for thick, tape-like echoes.
let dry, wet, dFx = null, fatCurve = null;
function buildDelay(src) {
  const mk = () => ctx.createDelay(4);   // 4 s: a half note at the slowest tempo (40 bpm) is 3 s
  dry = ctx.createGain(); wet = ctx.createGain();
  src.connect(dry); dry.connect(ctx.destination); wet.connect(ctx.destination);
  const ppIn = ctx.createGain(), moIn = ctx.createGain();
  src.connect(ppIn); src.connect(moIn);
  const dL = mk(), dR = mk(), dM = mk(), loops = [];
  const hop = (from, to) => {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 20000;
    const sat = ctx.createWaveShaper(), g = ctx.createGain();
    from.connect(lp); lp.connect(sat); sat.connect(g); g.connect(to); loops.push({ lp, sat, g });
  };
  ppIn.connect(dL); hop(dL, dR); hop(dR, dL);
  const pl = ctx.createStereoPanner(), pr = ctx.createStereoPanner(); pl.pan.value = -1; pr.pan.value = 1;
  dL.connect(pl); dR.connect(pr); pl.connect(wet); pr.connect(wet);
  moIn.connect(dM); hop(dM, dM); dM.connect(wet);
  const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = 0.7; lfoG.gain.value = 0;
  lfo.connect(lfoG); for (const d of [dL, dR, dM]) lfoG.connect(d.delayTime);
  lfo.start();
  // Unity slope near zero: the curve squashes peaks and adds harmonics but never adds gain, so repeats still die away.
  if (!fatCurve) { fatCurve = new Float32Array(1024); for (let k = 0; k < 1024; k++) fatCurve[k] = Math.tanh((k / 511.5 - 1) * 2.2) / 2.2; }
  dFx = { ppIn, moIn, dL, dR, dM, loops, lfoG, fat: null };
  applyDelay(true);
}
// snap = true sets values outright (graph build, offline checks); otherwise they glide, so a twist never clicks.
// The delay time in seconds right now: the ms knob, or the chosen note division at the current tempo.
const delaySec = () => (S.delay.sync ? T.syncSec(val('dtime'), T.bpmOf(val('tempo'))) : T.delayMs(val('dtime')) / 1000);
function applyDelay(snap) {
  if (!dFx) return;
  const now = ctx.currentTime, set = (p, v) => (snap ? (p.value = v) : p.setTargetAtTime(v, now, 0.03));
  const sec = delaySec(), fb = T.delayFb(val('dfb')), mix = val('dmix'), fat = S.delay.fat;
  for (const d of [dFx.dL, dFx.dR, dFx.dM]) set(d.delayTime, sec);
  set(dFx.ppIn.gain, S.delay.pp ? 1 : 0); set(dFx.moIn.gain, S.delay.pp ? 0 : 1);
  for (const l of dFx.loops) { set(l.g.gain, fb); set(l.lp.frequency, fat ? 2600 : 20000); }
  if (dFx.fat !== fat) { for (const l of dFx.loops) l.sat.curve = fat ? fatCurve : null; dFx.fat = fat; }
  set(dFx.lfoG.gain, fat ? 0.002 : 0);
  set(dry.gain, Math.cos(mix * Math.PI / 2)); set(wet.gain, Math.sin(mix * Math.PI / 2) * (fat ? 1.25 : 1));   // equal-power crossfade
}
function paintDelay() { flag('dPP', S.delay.pp); flag('dFat', S.delay.fat); flag('dSync', S.delay.sync); $('dMs').disabled = S.delay.sync; if (knobUI.dtime) paintKnob('dtime'); applyDelay(); }
// A knob's live value: its manual position, or the automation sine when that is on. The sine's clock is the
// tempo KNOB's manual value, so automating tempo never feeds back into its own LFO.
const beatsAt = (t) => t * T.bpmOf(S.knobs.tempo) / 60;
const val = (key, t) => { const a = S.auto[key]; return a.on && ctx ? T.autoValue(a, beatsAt(t === undefined ? ctx.currentTime : t)) : S.knobs[key]; };
const effCut = (t) => val('cutoff', t);
// Gate off truncates whatever attack/decay is still pending (cancelScheduledValues) and starts both releases.
function gateOff(t) {
  const base = T.cutoffHz(effCut(t));
  for (const p of [f1.frequency, f2.frequency]) { p.cancelScheduledValues(t); p.setTargetAtTime(base, t, T.relSec(val('frel', t)) / 3); }
  vca.gain.cancelScheduledValues(t);
  vca.gain.setTargetAtTime(0, t, T.relSec(val('arel', t)) / 3);
}
// One step's worth of voice. t is AudioContext time; ev is the core's stepEvent output.
function play(ev, t, sec) {
  if (ev.off) return;
  const k = {}; for (const n of Object.keys(S.knobs)) k[n] = val(n, t);
  const f = T.freqOf(ev.midi, T.tuneCents(k.tuning));
  if (ev.glide) {
    osc.frequency.setValueAtTime(lastFreq, t);
    osc.frequency.exponentialRampToValueAtTime(f, t + 0.06);   // the 303's ~60 ms slide
  } else if (ev.trig) {
    osc.frequency.setValueAtTime(f, t);
  }
  lastFreq = f;
  const tOff = ev.hold ? Infinity : t + sec * (ev.len < 0.9 ? T.gateFrac(k.gate) : ev.len);
  if (ev.trig) {
    sweep = ev.accent ? Math.min(1, sweep + 0.35) : sweep * 0.5;   // the accent capacitor: stacked accents build
    const base = T.cutoffHz(effCut(t)), acc = ev.accent ? k.accent : 0;
    const oct = k.envmod * 4.5 + acc * 1.6 + sweep * k.accent * 0.8;
    const peak = Math.min(base * Math.pow(2, oct), 16000);
    const hold = Math.min(base * Math.pow(2, oct * k.fsus), 16000);   // filter sustain: a fraction of the env depth, in octaves
    const atk = T.atkSec(k.fatk), dec = ev.accent ? Math.min(T.decSec(k.fdec), 0.2) : T.decSec(k.fdec);   // accent: short filter decay
    const top = Math.max(Math.min(t + atk, tOff - 0.001), t + 0.001);   // the peak is reached before a short gate closes
    for (const p of [f1.frequency, f2.frequency]) {
      p.cancelScheduledValues(t); p.setValueAtTime(base, t); p.exponentialRampToValueAtTime(peak, top); p.setTargetAtTime(hold, top, dec / 3);
    }
    const L = 0.45 * (1 + acc * 0.9) / (1 + k.res * 0.6);   // res eats level on hardware too
    const aa = Math.max(T.atkSec(k.aatk), 0.002);
    vca.gain.cancelScheduledValues(t);
    vca.gain.setTargetAtTime(L, t, aa / 4);
    vca.gain.setTargetAtTime(L * k.asus, t + aa, T.decSec(k.adec) / 3);
  }
  if (tOff !== Infinity) gateOff(tOff);
}

// ---- sequencer: look-ahead scheduler on audio time ----
const bpm = () => T.bpmOf(val('tempo'));
function tick() {
  if (!run.on) return;
  const horizon = ctx.currentTime + 0.12;
  while (run.next < horizon) {
    const p = S.patterns[run.slot], i = run.step, sec = T.stepSeconds(bpm());
    const t = run.next + (i % 2 ? S.swing * sec * 0.33 : 0);
    play(T.stepEvent(p, i), t, sec);
    queue.push({ t, slot: run.slot, step: i });
    run.next += sec;
    if (++run.step >= p.len) {
      run.step = 0;
      if (run.stopAtEnd) { stopRun(false); return; }
      const n = T.nextSlot(S, songMode, run.songPos);
      run.slot = n.slot; run.songPos = n.songPos;
    }
  }
}
function startRun() {
  ensureAudio();
  run.on = true; run.stopAtEnd = false; run.step = 0; run.songPos = 0;
  run.slot = songMode === 'track' && S.song.length ? S.song[0] : S.cur;
  run.next = ctx.currentTime + 0.06; sweep = 0;
  timer = setInterval(tick, 25); tick(); paintRun();
}
function stopRun(now) {
  if (!run.on) return;
  if (now === false || !$('sync').checked) {
    run.on = false; clearInterval(timer); timer = null; queue.length = 0;
    if (ctx) { vca.gain.cancelScheduledValues(ctx.currentTime); gateOff(ctx.currentTime); }
    paintRun(); paintSteps();
  } else { run.stopAtEnd = true; }
}
$('run').onclick = () => (run.on ? stopRun(true) : startRun());

// ---- live keys ----
const held = [];
function noteOn(n) {
  ensureAudio();
  const midi = T.midiOf({ note: n, oct: mods.oct });
  const legato = mods.slide && held.length > 0;
  const t = ctx.currentTime + 0.005;
  held.push(n);
  play({ off: false, trig: !legato, glide: legato, midi, accent: mods.accent, hold: true, len: 1 }, t, 0.3);
  if (rec) { cursor = T.writeNote(S.patterns[S.cur], cursor, n, mods); paintSteps(); save(); }
}
function noteOff(n) {
  const i = held.lastIndexOf(n);
  if (i < 0) return;
  held.splice(i, 1);
  if (!held.length && ctx && !run.on) gateOff(ctx.currentTime + 0.01);
}
const KEYMAP = 'zsxdcvgbhnjm,';
const keyEls = [];
T.NAMES.forEach((nm, n) => {
  const b = document.createElement('button');
  b.className = 'key' + (nm.includes('#') ? ' sharp' : ''); b.textContent = nm; b.setAttribute('aria-label', 'Key ' + nm + (n === 12 ? ' high' : ''));

// ---- Web MIDI in: notes play the voice (and write steps while Write is on), velocity 110+ is an accent ----
let midiAccess = null;
const midiStatus = (t) => { $('midiMsg').textContent = t; };
function midiOn(midi, vel) {

  play({ off: false, trig: !legato, glide: legato, midi: midi + 12 * mods.oct, accent: acc, hold: true, len: 1 }, ctx.currentTime + 0.005, 0.3);

}

}
function listMidi() {

$('midiBtn').onclick = async () => {

const flag2 = (b, on) => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); };

$('oUp').onclick = () => { mods.oct = mods.oct === 1 ? 0 : 1; paintMods(); };

// ---- knobs ----
const pc = (v) => Math.round(v * 100) + '%';
const ms = (s) => (s < 1 ? Math.round(s * 1000) + 'ms' : s.toFixed(2) + 's');
// [key, label, formatter, container]
const KNOBDEF = [
  ['tuning', 'Tuning', (v) => (T.tuneCents(v) >= 0 ? '+' : '') + Math.round(T.tuneCents(v)) + 'c', 'knobs'],
  ['cutoff', 'Cutoff Freq', (v) => Math.round(T.cutoffHz(v)) + 'Hz', 'knobs'],
  ['res', 'Resonance', pc, 'knobs'],
  ['envmod', 'Env Mod', pc, 'knobs'],
  ['accent', 'Accent', pc, 'knobs'],
  ['volume', 'Volume', pc, 'knobs'],
  ['tempo', 'Tempo', (v) => T.bpmOf(v) + ' bpm', 'knobs'],
  ['fatk', 'Attack', (v) => ms(T.atkSec(v)), 'envF'],
  ['fdec', 'Decay', (v) => ms(T.decSec(v)), 'envF'],
  ['fsus', 'Sustain', pc, 'envF'],
  ['frel', 'Release', (v) => ms(T.relSec(v)), 'envF'],
  ['aatk', 'Attack', (v) => ms(T.atkSec(v)), 'envA'],
  ['adec', 'Decay', (v) => ms(T.decSec(v)), 'envA'],
  ['asus', 'Sustain', pc, 'envA'],
  ['arel', 'Release', (v) => ms(T.relSec(v)), 'envA'],
  ['gate', 'Gate length', (v) => pc(T.gateFrac(v)), 'envG'],
  ['dtime', 'Time', (v) => (S.delay.sync ? T.syncDiv(v).name : Math.round(T.delayMs(v)) + 'ms'), 'fxK'],
  ['dfb', 'Feedback', (v) => pc(T.delayFb(v)), 'fxK'],
  ['dmix', 'Mix', pc, 'fxK'],

const knobUI = {};
function setKnob(key, v) {
  v = Math.min(1, Math.max(0, v));
  S.knobs[key] = v; paintKnob(key); save();
  if (!ctx) return;
  const now = ctx.currentTime;
  if (key === 'res') f2.Q.setTargetAtTime(T.resQ(v), now, 0.02);
  if (key === 'volume') master.gain.setTargetAtTime(v, now, 0.02);
  if (key === 'cutoff') applyCutoff();
  if (key === 'dtime' || key === 'dfb' || key === 'dmix') applyDelay();
  if (key === 'tempo' && S.delay.sync) { applyDelay(); paintKnob('dtime'); }   // a synced echo follows the tempo knob
}
// The envelope decays toward the cutoff knob, so a held note or a running line follows a twist at once. It
// does flatten the tail of a decay already under way; each new note restarts from the new base anyway.
function applyCutoff() {
  if (!ctx) return;
  for (const p of [f1.frequency, f2.frequency]) p.setTargetAtTime(T.cutoffHz(effCut()), ctx.currentTime, 0.05);
}
function paintKnob(key) {
  const def = KNOBDEF.find((d) => d[0] === key), ui = knobUI[key], v = val(key);
  ui.el.classList.toggle('auto', S.auto[key].on);
  ui.el.style.setProperty('--a', (-135 + v * 270) + 'deg');
  ui.el.setAttribute('aria-valuenow', Math.round(v * 100)); ui.el.setAttribute('aria-valuetext', def[2](v));
  ui.val.textContent = def[2](v);

}
// The two envelope shapes, drawn from the live values: attack up, decay to the sustain level, a held stretch, release.
function drawEnv(cv, pre) {
  const w = cv.width = cv.clientWidth * 2 || 240, h = cv.height = 72, v = (n) => val(pre + n);
  const a = T.atkSec(v('atk')), d = T.decSec(v('dec')), r = T.relSec(v('rel')), s = v('sus'), hold = 0.35;
  const tot = a + d + hold + r, x = (t) => 4 + (t / tot) * (w - 8), y = (l) => h - 6 - l * (h - 12);

for (const [key, label, , cont] of KNOBDEF) {
  const w = document.createElement('div'); w.className = 'kw';
  const el = document.createElement('div'); el.className = 'knob'; el.tabIndex = 0; el.setAttribute('role', 'slider');
  el.setAttribute('aria-label', label); el.setAttribute('aria-valuemin', 0); el.setAttribute('aria-valuemax', 100);
  const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = label;
  const val = document.createElement('div'); val.className = 'val';
  const au = document.createElement('div'); au.className = 'au';
  au.innerHTML = '<div><input class="mn" type="number" min="0" max="100" step="1" title="automation minimum, % of the knob travel"><input class="mx" type="number" min="0" max="100" step="1" title="automation maximum, % of the knob travel"></div><div><button class="on btn" title="automate this knob: sweep between min and max">~</button><input class="rt" type="number" min="0.25" max="64" step="0.25" title="beats per full sweep (follows tempo)"></div>';
  const [mn, mx] = au.children[0].children, [onb, rt] = au.children[1].children;

  onb.setAttribute('aria-label', label + ' automation on'); rt.setAttribute('aria-label', label + ' beats per sweep');
  w.append(el, lab, val, au); $(cont).appendChild(w); knobUI[key] = { el, val, au };
  const sync = () => { const a = S.auto[key]; mn.value = Math.round(a.min * 100); mx.value = Math.round(a.max * 100); rt.value = a.rate; flag2(onb, a.on); paintKnob(key); };

  const edit = (f) => () => { f(S.auto[key]); S.auto[key] = T.cleanState({ auto: { [key]: S.auto[key] } }).auto[key]; ensureAudio(); sync(); save(); };

const cells = [];

    x.c.classList.toggle('off', i >= p.len); x.c.classList.toggle('cur', i === cursor);
    x.sb.className = 'sb ' + s.gate;

    const [o, a, sl] = x.chips.children;

    o.classList.toggle('on', s.oct !== 0); a.classList.toggle('on', s.accent); sl.classList.toggle('on', s.slide);

function paintRun() { flag('run', run.on); }
// LEDs ride audio time: pop every queued step whose time has come.
(function raf() {
  if (run.on && ctx) {
    while (queue.length && queue[0].t <= ctx.currentTime) { playing = queue.shift().step; paintSteps(); }
  } else if (playing !== -1) { playing = -1; paintSteps(); }
  requestAnimationFrame(raf);

// Automation: the sine's value is re-applied to the live params 30x a second. Per-note params (decay, env mod,

setInterval(() => {
  if (!ctx) return;
  let any = false;
  for (const key of Object.keys(knobUI)) if (S.auto[key].on) { any = true; paintKnob(key); }
  if (!any) return;
  const now = ctx.currentTime;
  if (S.auto.res.on) f2.Q.setTargetAtTime(T.resQ(val('res')), now, 0.02);
  if (S.auto.volume.on) master.gain.setTargetAtTime(val('volume'), now, 0.02);
  if (S.auto.cutoff.on) applyCutoff();
  if (S.auto.dtime.on || S.auto.dfb.on || S.auto.dmix.on || (S.delay.sync && S.auto.tempo.on)) applyDelay();

$('autoBtn').onclick = () => { const on = !$('case').classList.contains('showauto'); $('case').classList.toggle('showauto', on); flag('autoBtn', on); };
$('fxBtn').onclick = () => { const on = $('fx').classList.contains('hidden'); $('fx').classList.toggle('hidden', !on); flag('fxBtn', on); };
$('dPP').onclick = () => { ensureAudio(); S.delay.pp = !S.delay.pp; paintDelay(); save(); };
$('dFat').onclick = () => { ensureAudio(); S.delay.fat = !S.delay.fat; paintDelay(); save(); };
$('dSync').onclick = () => {
  ensureAudio();
  const sec = delaySec(), bpm = T.bpmOf(val('tempo'));

};
$('dMs').onchange = () => setKnob('dtime', T.msToKnob($('dMs').value));
$('envBtn').onclick = () => { const on = $('env').classList.contains('hidden'); $('env').classList.toggle('hidden', !on); flag('envBtn', on); if (on) drawEnvs(); };

// ---- pattern select, length, transport extras ----

    b.setAttribute('aria-label', grp.slice(1) + ' ' + label(j));

mkSel('gGroup', 2, (j) => 'AB'[j], (j) => { S.cur = Math.floor(S.cur / 16) * 16 + j * 8 + (S.cur % 8); });
mkSel('gSlot', 8, (j) => String(j + 1), (j) => { S.cur = Math.floor(S.cur / 8) * 8 + j; });

$('wRest').onclick = () => blank('rest');

$('next').onclick = () => { cursor = (cursor + 1) % S.patterns[S.cur].len; paintSteps(); };

$('lenM').onclick = () => setLen(-1); $('lenP').onclick = () => setLen(1);
$('clear').onclick = () => { S.patterns[S.cur] = T.emptyPattern(); cursor = 0; paintSteps(); save(); };
$('sAdd').onclick = () => { if (S.song.length < 16) S.song.push(S.cur); paintSteps(); save(); };
$('demo').onclick = () => { T.loadDemo(S); for (const k of Object.keys(knobUI)) knobUI[k].sync(); if (ctx) { f2.Q.value = T.resQ(S.knobs.res); applyCutoff(); } cursor = 0; paintSteps(); save(); };
$('sClr').onclick = () => { S.song = []; paintSteps(); save(); };
$('expFiles').onclick = () => {
  const files = T.exportFiles(S);

  try { S.patterns[S.cur] = T.cleanPattern(JSON.parse($('io').value)); cursor = 0; paintSteps(); save(); $('msg').textContent = 'imported'; }

$('sync').onchange = () => { if (!$('sync').checked) run.stopAtEnd = false; };

// ---- persistence: this page's own localStorage (blocked storage just means a fresh machine each visit) ----
let saveT = null;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem('acidbass2', JSON.stringify(S)); } catch (_) { /* storage blocked */ } }, 400);
}
function adopt(raw) {

try { const v = localStorage.getItem('acidbass2'); if (v) adopt(v); } catch (_) { /* storage blocked */ }
